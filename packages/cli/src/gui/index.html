<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Browser tasks</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Task history">
        <div class="sidebar-head">
          <button class="icon-button mobile-only" data-close="sidebar" aria-label="Close task history">×</button>
        </div>
        <button class="new-task" id="new-task"><span aria-hidden="true">＋</span> New task <kbd>⌘N</kbd></button>
        <nav class="history" aria-label="Recent tasks">
          <p class="section-label">Recent</p>
          <div id="history-list" class="history-list"></div>
        </nav>
      </aside>

      <div class="mobile-scrim" id="scrim"></div>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-only" id="history-toggle" aria-label="Open task history">☰</button>
          <div class="title-block">
            <strong id="task-title">New browser task</strong>
          </div>
          <div class="top-actions">
            <button class="quiet-button" id="clear-chat">Clear</button>
            <button class="icon-button settings-button" id="settings-toggle" aria-label="Open run settings">⌘</button>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="empty-state" id="empty-state">
            <h1>What can I help you do?</h1>
            <p>Describe a browser task. The agent will run it and verify the result.</p>
            <div class="suggestion-grid">
              <button class="suggestion" data-prompt="Open the documentation and find the installation command">
                <strong>Find information</strong><span aria-hidden="true">↗</span>
              </button>
              <button class="suggestion" data-prompt="Complete the form using the details I provide">
                <strong>Complete a workflow</strong><span aria-hidden="true">↗</span>
              </button>
              <button class="suggestion" data-prompt="Check whether this page contains the expected status">
                <strong>Verify a page</strong><span aria-hidden="true">↗</span>
              </button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <label class="sr-only" for="task-input">Browser task</label>
            <textarea id="task-input" rows="1" placeholder="Describe a browser task…" maxlength="8000"></textarea>
            <div class="composer-bar">
              <div class="run-context">
                <button type="button" class="context-pill" id="provider-shortcut"><span id="provider-label">Codex</span><span class="chevron">⌄</span></button>
                <span class="context-separator"></span>
                <span class="verify-hint" id="verify-hint">Add a success check in settings</span>
              </div>
              <div class="send-cluster">
                <span class="shortcut">↵ send</span>
                <button class="send-button" id="send-button" type="submit" aria-label="Run task">↑</button>
              </div>
            </div>
          </form>
        </div>
      </main>

      <aside class="inspector" id="inspector" aria-label="Run settings">
        <div class="inspector-head">
          <div><p class="section-label">Environment</p><h2>Run settings</h2></div>
          <button class="icon-button" data-close="inspector" aria-label="Close run settings">×</button>
        </div>
        <div class="settings-scroll">
          <section class="setting-section">
            <label for="start-url">Starting URL</label>
            <input id="start-url" type="url" placeholder="https://example.com" autocomplete="url">
            <p>The first page the browser opens.</p>
          </section>
          <section class="setting-section">
            <label for="verify-text">Success check <span>required</span></label>
            <input id="verify-text" type="text" placeholder="Text visible after success" maxlength="2000">
            <p>The run only succeeds when this text is visible.</p>
          </section>
          <section class="setting-section two-column">
            <div class="provider-picker" id="provider-picker">
              <label for="provider-toggle">Provider</label>
              <input id="provider" type="hidden" value="codex">
              <button id="provider-toggle" class="provider-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="provider-options">
                <span id="provider-selected">Codex subscription</span><span class="chevron" aria-hidden="true">⌄</span>
              </button>
              <div id="provider-options" class="provider-options" role="listbox" aria-label="Provider" hidden>
                <button type="button" role="option" aria-selected="true" data-provider="codex"><span>Codex subscription</span><small>Use your signed-in session</small></button>
                <button type="button" role="option" aria-selected="false" data-provider="claude-code"><span>Claude Code subscription</span><small>Use your signed-in session</small></button>
                <button type="button" role="option" aria-selected="false" data-provider="openai"><span>OpenAI API</span><small>Use an API key</small></button>
                <button type="button" role="option" aria-selected="false" data-provider="anthropic"><span>Anthropic API</span><small>Use an API key</small></button>
              </div>
            </div>
            <div><label for="max-steps">Max steps</label><input id="max-steps" type="number" min="1" max="500" value="20"></div>
          </section>
          <section class="setting-section">
            <label for="model">Model override <span>optional</span></label>
            <input id="model" type="text" placeholder="Use provider default" maxlength="200">
          </section>
        </div>
      </aside>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
