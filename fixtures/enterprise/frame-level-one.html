<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Nested frame level one</title></head>
<body>
  <h2>Workspace shell</h2>
  <iframe title="Nested approval panel" name="nested-approval" data-context-key="nested-approval"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const scope = params.get('scope') ?? 'unknown';
    const duplicate = params.get('duplicate') === 'true' ? '&duplicate=true' : '';
    document.querySelector('iframe').src = `./frame-level-two.html?scope=${scope}${duplicate}`;
  </script>
</body>
</html>
