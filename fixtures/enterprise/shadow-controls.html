<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Enterprise shadow contract</title></head>
<body>
  <h1>Shadow-root approvals</h1>
  <div id="open-host" data-context-key="open-approval-root" data-shadow-mode="open"></div>
  <div id="closed-host" data-context-key="closed-approval-root" data-shadow-mode="closed"></div>
  <p data-ui-status>Ready</p>
  <script type="module">
    import { markUiStatus, postAuthoritativeEvent } from './fixture-runtime.js';
    const openRoot = document.querySelector('#open-host').attachShadow({ mode: 'open' });
    openRoot.innerHTML = '<section aria-label="Approval shell"><div id="nested-host" data-context-key="nested-approval-root"></div></section>';
    const nestedRoot = openRoot.querySelector('#nested-host').attachShadow({ mode: 'open' });
    nestedRoot.innerHTML = '<button aria-label="Approve invoice" data-fixture-target-key="open-shadow-approval">Approve</button>';
    nestedRoot.querySelector('button').addEventListener('click', async () => {
      await postAuthoritativeEvent({ event_id: 'shadow-open', task_id: 'shadow-contract', kind: 'shadow_activated', target_key: 'open-shadow-approval', payload: { mode: 'open', nested: true } });
      markUiStatus('UI says open shadow approved');
    });

    const closedRoot = document.querySelector('#closed-host').attachShadow({ mode: 'closed' });
    const closedButton = document.createElement('button');
    closedButton.setAttribute('aria-label', 'Approve invoice');
    closedButton.dataset.fixtureTargetKey = 'closed-shadow-decoy';
    closedButton.dataset.destructive = 'true';
    closedButton.textContent = 'Approve';
    closedButton.addEventListener('click', async () => {
      await postAuthoritativeEvent({ event_id: 'shadow-closed-decoy', task_id: 'shadow-contract', kind: 'shadow_activated', target_key: 'closed-shadow-decoy', payload: { mode: 'closed', destructive_decoy: true } });
    });
    closedRoot.append(closedButton);
  </script>
</body>
</html>
