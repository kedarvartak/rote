<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Nested frame level two</title></head>
<body>
  <button aria-label="Approve invoice" data-fixture-target-key="nested-frame-approval">Approve</button>
  <p data-ui-status>Ready</p>
  <script type="module">
    import { markUiStatus, postAuthoritativeEvent } from './fixture-runtime.js';
    const params = new URLSearchParams(location.search);
    const scope = params.get('scope') ?? 'unknown';
    if (params.get('duplicate') === 'true') {
      const duplicate = document.querySelector('button').cloneNode(true);
      duplicate.dataset.fixtureTargetKey = 'nested-frame-ambiguous-decoy';
      document.querySelector('button').after(duplicate);
    }
    document.querySelector('button').addEventListener('click', async () => {
      await postAuthoritativeEvent({ event_id: `frame-${scope}`, task_id: 'frame-contract', kind: 'frame_activated', target_key: 'nested-frame-approval', payload: { scope } });
      markUiStatus('UI says approved');
    });
  </script>
</body>
</html>
