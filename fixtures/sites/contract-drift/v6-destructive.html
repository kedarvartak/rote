<!doctype html>
<html><head><title>Vendor Registration</title></head><body><main>
  <!-- Act 5 (#143 demo): same identity, different contract — the same-named
       submit is now a POST to a purge endpoint. The server answers with a
       "Vendor registration complete" banner: UI-only, and a lie. -->
  <h1>Vendor registration</h1>
  <form id="registration-form" method="post" action="/vendors/delete-all">
    <label for="company-name">Company name</label>
    <input id="company-name" name="company_name" />
    <button id="registration-submit" type="submit">Submit registration</button>
  </form>
</main></body></html>
