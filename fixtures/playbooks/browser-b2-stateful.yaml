playbook: browser-b2-stateful
version: 1

task_signature:
  intent_description: Submit the frozen vendor registration form
  env_fingerprint:
    domain: 127.0.0.1
    tool_prefixes: [browser.]

params:
  - name: base_url
    type: string
  - name: company_name
    type: string
  - name: contact_email
    type: string
  - name: tax_id
    type: string
  - name: address_line1
    type: string
  - name: city
    type: string
  - name: postal_code
    type: string
  - name: country
    type: string
  - name: phone
    type: string

steps:
  - id: open_registration
    kind: deterministic
    tool: browser.navigate
    args: { url: "{{base_url}}/b2-vendor-form.html" }
    expect: { selector_visible: "#registration-form" }
    on_fail: fallback
  - id: fill_company
    kind: deterministic
    depends_on: [open_registration]
    tool: browser.fill
    args: { selector: "#company-name", value: "{{company_name}}" }
    expect: { input_value: "#company-name", equals: "{{company_name}}" }
    on_fail: fallback
  - id: fill_email
    kind: deterministic
    depends_on: [fill_company]
    tool: browser.fill
    args: { selector: "#contact-email", value: "{{contact_email}}" }
    expect: { input_value: "#contact-email", equals: "{{contact_email}}" }
    on_fail: fallback
  - id: fill_tax_id
    kind: deterministic
    depends_on: [fill_email]
    tool: browser.fill
    args: { selector: "#tax-id", value: "{{tax_id}}" }
    expect: { input_value: "#tax-id", equals: "{{tax_id}}" }
    on_fail: fallback
  - id: fill_address
    kind: deterministic
    depends_on: [fill_tax_id]
    tool: browser.fill
    args: { selector: "#address-line1", value: "{{address_line1}}" }
    expect: { input_value: "#address-line1", equals: "{{address_line1}}" }
    on_fail: fallback
  - id: fill_city
    kind: deterministic
    depends_on: [fill_address]
    tool: browser.fill
    args: { selector: "#city", value: "{{city}}" }
    expect: { input_value: "#city", equals: "{{city}}" }
    on_fail: fallback
  - id: fill_postal_code
    kind: deterministic
    depends_on: [fill_city]
    tool: browser.fill
    args: { selector: "#postal-code", value: "{{postal_code}}" }
    expect: { input_value: "#postal-code", equals: "{{postal_code}}" }
    on_fail: fallback
  - id: select_country
    kind: deterministic
    depends_on: [fill_postal_code]
    tool: browser.select
    args: { selector: "#country", value: "{{country}}" }
    expect: { input_value: "#country", equals: "{{country}}" }
    on_fail: fallback
  - id: fill_phone
    kind: deterministic
    depends_on: [select_country]
    tool: browser.fill
    args: { selector: "#phone", value: "{{phone}}" }
    expect: { input_value: "#phone", equals: "{{phone}}" }
    on_fail: fallback
  - id: submit_registration
    kind: deterministic
    depends_on: [fill_phone]
    tool: browser.click
    args: { selector: "#registration-submit" }
    expect: { text_visible: "Vendor registration complete" }
    on_fail: fallback

verify:
  - text_visible: "Vendor registration complete | company_name={{company_name}} | contact_email={{contact_email}} | tax_id={{tax_id}} | address_line1={{address_line1}} | city={{city}} | postal_code={{postal_code}} | country={{country}} | phone={{phone}}"

confidence: 1
