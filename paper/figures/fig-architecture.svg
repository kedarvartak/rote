<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"><rect width="720" height="330" fill="#ffffff"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b0b0b"/></marker></defs><rect x="16" y="16" width="200" height="252" rx="12" fill="#f0f5fc" stroke="#c9dcf3"/><text x="116" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">The loop (one run)</text><rect x="36" y="48" width="160" height="56" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="116" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Observe</text><text x="116" y="86" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">distilled page, stable IDs,</text><text x="116" y="101" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">diffed vs. grounded base</text><rect x="36" y="118" width="160" height="44" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="116" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Decide</text><text x="116" y="156" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">planner picks one action</text><rect x="36" y="176" width="160" height="56" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="116" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Act + verify</text><text x="116" y="214" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">settled, assertion-gated,</text><text x="116" y="229" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">authoritative evidence</text><line x1="116" y1="104" x2="116" y2="118" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><line x1="116" y1="162" x2="116" y2="176" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><path d="M 36 204 C 8 204 8 76 36 76" fill="none" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><rect x="300" y="16" width="404" height="252" rx="12" fill="#eefaf4" stroke="#bfe8d5"/><text x="502" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">The memory (three tiers)</text><rect x="320" y="48" width="364" height="62" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/><text x="502" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Tier 0 — working (within one run)</text><text x="502" y="86" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">budget · observation eviction · diff</text><text x="502" y="101" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">cache-stable layout · scheduled compaction</text><rect x="320" y="122" width="364" height="62" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/><text x="502" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Tier 1 — episodic (across runs of one task)</text><text x="502" y="160" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">record → distill → playbook →</text><text x="502" y="175" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">matcher → contract-gated replay</text><rect x="320" y="196" width="364" height="56" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.5"/><text x="502" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Tier 2 — semantic (across tasks on one site)</text><text x="502" y="234" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">value-free site memory → advisory brief</text><line x1="216" y1="76" x2="300" y2="76" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><text x="258" y="70" text-anchor="middle" font-size="10" fill="#52514e" font-family="Helvetica,Arial,sans-serif">every step</text><line x1="216" y1="140" x2="320" y2="152" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><text x="268" y="140" text-anchor="middle" font-size="10" fill="#52514e" font-family="Helvetica,Arial,sans-serif">record</text><line x1="320" y1="166" x2="216" y2="196" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="268" y="175" text-anchor="middle" font-size="10" fill="#52514e" font-family="Helvetica,Arial,sans-serif">verified replay</text><rect x="16" y="284" width="688" height="34" rx="10" fill="#fdf1f0" stroke="#e34948" stroke-width="1.5"/><text x="360" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif"></text><text x="360" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0b0b0b" font-family="Helvetica,Arial,sans-serif">Trust gate — precondition for every tier</text><text x="360" y="313" text-anchor="middle" font-size="10.5" fill="#52514e" font-family="Helvetica,Arial,sans-serif">fingerprint (hard) · matcher fails closed · action contract before dispatch · authoritative outcome evidence</text><line x1="502" y1="252" x2="502" y2="284" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/><line x1="116" y1="232" x2="116" y2="284" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)"/></svg>