<svg xmlns="http://www.w3.org/2000/svg" width="990" height="570" viewBox="0 0 990 570"><rect width="990" height="570" fill="#ffffff"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a1a1a"/></marker></defs><text x="490" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">Rote: the memory manager for browser agents</text><text x="490" y="54" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">the context window is a managed resource: a budget, an eviction policy, a layout contract, a trust gate</text><rect x="30" y="80" width="270" height="360" rx="14" fill="#f0f5fc" stroke="#c9dcf3"/><text x="165" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">THE LOOP (one run)</text><rect x="55" y="118" width="220" height="74" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text x="165" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">Observe</text><text x="165" y="160" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">distilled page, stable IDs,</text><text x="165" y="177" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">diffed vs. grounded base</text><rect x="55" y="212" width="220" height="68" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text x="165" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">Decide</text><text x="165" y="254" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">planner picks one action;</text><text x="165" y="271" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">routine/frontier routed</text><rect x="55" y="300" width="220" height="74" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text x="165" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">Act + verify</text><text x="165" y="342" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">settled, assertion-gated,</text><text x="165" y="359" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">authoritative evidence</text><line x1="165" y1="192" x2="165" y2="212" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="165" y1="280" x2="165" y2="300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 55 337 C 18 337 18 155 55 155" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><text x="36" y="246" text-anchor="middle" font-size="10" fill="#5b5955" font-family="Helvetica,Arial,sans-serif" transform="rotate(-90 36 246)">next step</text><rect x="380" y="80" width="580" height="360" rx="14" fill="#eefaf4" stroke="#bfe8d5"/><text x="670" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">THE MEMORY (three tiers)</text><rect x="405" y="118" width="530" height="92" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text x="670" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">TIER 0 — WORKING (within one run)</text><text x="670" y="160" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">evict observations · diff · budget · cache-stable layout · compaction</text><text x="670" y="200" text-anchor="middle" font-size="11" font-style="italic" fill="#1baf7a" font-family="Helvetica,Arial,sans-serif">built · P1 certified (T10/T11/T25), SPA-endurance certified (T34)</text><rect x="405" y="226" width="530" height="92" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text x="670" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">TIER 1 — EPISODIC (across runs of a task)</text><text x="670" y="268" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">record → distill → playbook → matcher → contract-gated replay</text><text x="670" y="308" text-anchor="middle" font-size="11" font-style="italic" fill="#1baf7a" font-family="Helvetica,Arial,sans-serif">built · zero-LLM replay certified (T36/T40/T41); billed T0 curve pending</text><rect x="405" y="334" width="530" height="92" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text x="670" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">TIER 2 — SEMANTIC (across tasks on a site)</text><text x="670" y="376" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">site brief · selector maps · settle priors · quirks — advisory only</text><text x="670" y="416" text-anchor="middle" font-size="11" font-style="italic" fill="#1baf7a" font-family="Helvetica,Arial,sans-serif">built · value-free store + brief + settle priors; billed T2 utility pending</text><line x1="300" y1="160" x2="405" y2="160" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><text x="352.5" y="153" text-anchor="middle" font-size="11" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">every step</text><line x1="300" y1="246" x2="405" y2="272" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><text x="352.5" y="252" text-anchor="middle" font-size="11" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">record</text><line x1="405" y1="300" x2="300" y2="330" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="352.5" y="308" text-anchor="middle" font-size="11" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">verified replay</text><rect x="30" y="466" width="930" height="64" rx="12" fill="#fdf1f0" stroke="#e34948" stroke-width="1.6"/><text x="495" y="492" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="Helvetica,Arial,sans-serif">TRUST GATE — the precondition for every tier (invariant 1)</text><text x="495" y="512" text-anchor="middle" font-size="12" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">fingerprint (hard) · matcher fails closed · action contract before dispatch · authoritative outcome evidence — memory re-enters only through assertions</text><line x1="165" y1="374" x2="165" y2="466" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="670" y1="426" x2="670" y2="466" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/><text x="42" y="556" font-size="11" fill="#5b5955" font-family="Helvetica,Arial,sans-serif">design vs reality: docs/02 §Status is authoritative · regenerate with scripts/diagrams/architecture.mjs · statuses last synced 2026-08-22 (T41/#168)</text></svg>
